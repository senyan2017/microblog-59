{% extends "base.html" %}
{% import "bootstrap_wtf.html" as wtf %}

{% block content %}
    <h1>{{ _('Edit Post') }}</h1>
    {{ wtf.quick_form(form, action=url_for('main.edit_post', post_id=post.id, next=next_page)) }}
    <p>
        <a href="{{ next_page if next_page else url_for('main.index') }}">{{ _('Cancel') }}</a>
    </p>
{% endblock %}
